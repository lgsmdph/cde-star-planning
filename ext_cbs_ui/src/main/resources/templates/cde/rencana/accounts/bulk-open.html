<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bulk Open Account</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #ffffff;
            padding: 25px;
            font-family: "Segoe UI", Arial;
        }

        .btn-navy {
            background-color: #0d1b48;
            color: white;
            border-radius: 6px;
            padding: 6px 18px;
            font-weight: 500;
        }
        .btn-navy:hover {
            background-color: #142567;
            color: white;
        }

        /* Fancy Table */
        #resultTable {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.15);
        }

        .table thead tr {
            background: linear-gradient(to bottom, #e0ecff, #cfdffe);
            font-weight: bold;
            text-align: center;
            font-size: 14px;
            border-bottom: 2px solid #b7cafa;
        }

        .table tbody tr:nth-child(even) { background-color: #f9f9f9; }
        .table tbody tr:nth-child(odd)  { background-color: #ffffff; }

        .table tbody tr:hover {
            background-color: #eef4ff;
        }

        /* Rounded Header */
        .table thead th:first-child { border-top-left-radius: 8px; }
        .table thead th:last-child  { border-top-right-radius: 8px; }

        /* Dark Mode */
        .dark-mode { background-color: #1e1e1e !important; color: #f2f2f2 !important; }
        .dark-mode .table thead tr { background: linear-gradient(to bottom, #333c4f, #2a3244); color: #fff; }
        .dark-mode .table tbody tr:nth-child(even) { background-color: #2c2c2c; }
        .dark-mode .table tbody tr:nth-child(odd)  { background-color: #262626; }
        .dark-mode .table tbody tr:hover { background-color: #3a3a3a; }
    </style>
</head>
<body>

<div class="container">

    <h3 class="mb-4">Bulk Open Account</h3>

    <!-- Dark Mode -->
    <button onclick="toggleDark()" class="btn btn-secondary mb-3">🌙 Dark Mode</button>

    <!-- Form Upload -->
    <form th:action="@{/cde/rencana/accounts/bulk-open/upload}" method="post" enctype="multipart/form-data">
        <div class="input-group mb-3">
            <input type="file" name="file" class="form-control" required>
            <button class="btn btn-navy" type="submit">Upload</button>
        </div>
    </form>

    <!-- Message -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <!-- Download Button -->
<!--    <div th:if="${data}">-->
<!--        <a th:href="@{/cde/rencana/accounts/bulk-open/download}" class="btn btn-success mb-3">-->
<!--            ⬇ Download Excel-->
<!--        </a>-->
<!--    </div>-->

    <!-- Table -->
    <table id="resultTable" class="table table-bordered" th:if="${data}">
        <thead>
        <tr>
            <th>Employee No</th>
            <th>Term</th>
            <th>Funding Account</th>
            <th>Payway Account</th>
            <th>Installment Day</th>
            <th>First Installment Amount</th>
            <th>Installment Amount</th>
            <th>Description</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${data}">
            <td th:text="${row.employeeNo}"></td>
            <td th:text="${row.term}"></td>
            <td th:text="${row.contraAccount}"></td>
            <td th:text="${row.payawayAccount}"></td>
            <td th:text="${row.installmentDay}"></td>
            <td th:text="${row.firstInstallmentAmount}"></td>
            <td th:text="${row.installmentAmount}"></td>
            <td th:text="${row.description}"></td>
        </tr>
        </tbody>
    </table>

</div>

<script>
    function toggleDark() {
        document.body.classList.toggle("dark-mode");
    }
</script>

</body>
</html>
